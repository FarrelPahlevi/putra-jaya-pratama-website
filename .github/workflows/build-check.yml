name: Check PJP Website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Verify authorized photographs in public build
        run: |
          test -s dist/assets/pjp-preview/asphalt-road-preview.webp
          test -s dist/assets/pjp-preview/road-roller-preview.webp
          test -s dist/assets/pjp-preview/asphalt-access-preview.webp
          test -s dist/assets/pjp-preview/tree-lined-road-preview.webp
