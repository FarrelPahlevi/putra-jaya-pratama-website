name: Verify Putra Jaya Pratama Website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check and Vite production build
        run: npm run build
      - name: Validate design and authorized images
        run: |
          test -s src/MinimalIndustrial.tsx
          test -s src/minimal-industrial.css
          test -s src/GalleryPage.tsx
          test -s dist/galeri-proyek/index.html
          test -s dist/assets/pjp-preview/asphalt-access-preview.webp
          test -s dist/assets/pjp-preview/asphalt-road-preview.webp
          test -s dist/assets/pjp-preview/road-roller-preview.webp
          test -s dist/assets/pjp-preview/tree-lined-road-preview.webp
          for service in asphalt-hotmix paving-block cut-and-fill cor-beton saluran-u-ditch resapan-air; do
            test -s "dist/assets/services/$service-400.webp"
            test -s "dist/assets/services/$service-800.webp"
          done
