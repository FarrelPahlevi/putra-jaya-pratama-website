<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
<title id="title">Ilustrasi paver dan roller di pekerjaan pengaspalan jalan</title>
<desc id="desc">Ilustrasi industrial berwarna hitam, abu, dan kuning, tidak menggambarkan proyek asli PJP.</desc>
<defs>
 <linearGradient id="sky" x1="0" y1="0" y2="1"><stop stop-color="#393934"/><stop offset=".42" stop-color="#222625"/><stop offset="1" stop-color="#080a0b"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#E58A2A" stop-opacity=".87"/><stop offset=".4" stop-color="#C96A1B" stop-opacity=".30"/><stop offset="1" stop-color="#C96A1B" stop-opacity="0"/></radialGradient>
 <linearGradient id="road" x1="0" y1="0" x2=".1" y2="1"><stop stop-color="#454946"/><stop offset="1" stop-color="#111313"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#666d67"/><stop offset=".46" stop-color="#383d3b"/><stop offset="1" stop-color="#1c1f20"/></linearGradient>
 <linearGradient id="roller" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a4a79b"/><stop offset=".38" stop-color="#626861"/><stop offset="1" stop-color="#272a29"/></linearGradient>
 <pattern id="grain" width="72" height="72" patternUnits="userSpaceOnUse"><circle cx="8" cy="16" r="1" fill="#fff" opacity=".16"/><circle cx="53" cy="44" r="1.5" fill="#fff" opacity=".11"/><circle cx="35" cy="64" r=".7" fill="#fff" opacity=".13"/></pattern>
 <pattern id="marks" width="32" height="26" patternUnits="userSpaceOnUse"><path d="M0 25H32" stroke="#fff" opacity=".04"/></pattern>
 <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
</defs>
<rect width="1100" height="850" fill="url(#sky)"/>
<circle cx="780" cy="202" r="250" fill="url(#sun)"/>
