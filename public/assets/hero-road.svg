<path d="M0 520 170 479l320 0 162-20 448 82v310H0Z" fill="#111414"/>
<g opacity=".55" stroke="#8a9185" stroke-width="5"><path d="M72 413v120m26-128v128m-26-99h26M104 424l-31-26m31 26 30-35"/><path d="M963 381v158m26-163v163m-26-108h26M995 400l-32-24"/></g>
