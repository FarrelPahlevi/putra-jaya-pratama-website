 <rect x="339" y="271" width="21" height="15" rx="3" fill="#E58A2A"/>
 <path d="M-6 257h45M374 268h72" stroke="#bbc0b5" stroke-width="8"/>
</g>
<!-- road roller foreground left -->
<g transform="translate(20 490) scale(.72)">
